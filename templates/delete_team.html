<!DOCTYPE html>
<html>
<head>
    <title>Delete Team</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
    <script type="module" src="{{ url_for('static', path='firebase-login.js') }}"></script>
</head>
<body>
    <div class="navbar">
        <h1>Delete Team</h1>
        <div class="navbar-right">
            {% if user_token %}
            <p>USER: {{ user_token.email }}</p>
            <button id="logged-out">Logout</button>
            {% endif %}
        </div>
    </div>

    <div class="form-container">
        <a href="/all-teams" class="back-button">← Back to Teams List</a>
        <div class="form-box">
            <h2>Delete Team</h2>
            
            {% if error_message %}
            <div class="alert alert-error">
                {{ error_message }}
            </div>
            {% endif %}
            
            {% if success_message %}
            <div class="alert alert-success">
                {{ success_message }}
            </div>
            {% endif %}

            <form class="add-form" method="POST" action="/delete-team">
                <div class="form-group">
                    <label for="team_name">Select Team to Delete</label>
                    <select id="team_name" name="team_name" required>
                        <option value="">Select a team</option>
                        {% for team in teams %}
                        <option value="{{ team.to_dict().name }}">{{ team.to_dict().name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="submit-button delete" onclick="return confirm('Are you sure you want to delete this team?')">Delete Team</button>
                    <button type="reset" class="reset-button">Reset</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
