<!DOCTYPE html>
<html>

<head>
    <title>Add New Driver - F1 Database</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
    <script type="module" src="{{ url_for('static', path='firebase-login.js') }}"></script>
</head>

<body>
    <div class="navbar">
        <h1>Add New Driver</h1>
        <div class="navbar-right">
            {% if user_token %}
            <p>User email: {{ user_token.email }}</p>
            <button id="logged-out">Logout</button>
            {% endif %}
        </div>
    </div>

    <div class="form-container">
        <a href="/get-drivers" class="back-button">← Drivers list</a>
        {% if error_message %}
        <div class="alert alert-error">
            {{ error_message }}
        </div>
        {% endif %}

        {% if success_message %}
        <div class="alert alert-success">
            {{ success_message }}
        </div>
        {% endif %}
        <div class="form-box">
            <h2>Driver Information</h2>
            <form method="post" id="add-driver-form" action="/add-driver" class="add-form">
                <div class="form-group">
                    <label for="driver_name">Driver Name:</label>
                    <input type="text" id="driver_name" name="driver_name" required>
                </div>

                <div class="form-group">
                    <label for="driver_age">Age:</label>
                    <input type="number" id="driver_age" name="driver_age" required>
                </div>

                <div class="form-group">
                    <label for="team_name">Team Name:</label>
                    <select id="team_name" name="team_name" required>
                        <option value="">Select a team</option>
                        {% for team in teams %}
                        <option value="{{ team.to_dict().name }}">{{ team.to_dict().name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="total_pole_positions">Total Pole Positions:</label>
                    <input type="number" id="total_pole_positions" name="total_pole_positions" required>
                </div>

                <div class="form-group">
                    <label for="total_race_wins">Total Race Wins:</label>
                    <input type="number" id="total_race_wins" name="total_race_wins" required>
                </div>

                <div class="form-group">
                    <label for="total_points_scored">Total Points Scored:</label>
                    <input type="number" id="total_points_scored" name="total_points_scored" required>
                </div>

                <div class="form-group">
                    <label for="total_world_titles">Total World Titles:</label>
                    <input type="number" id="total_world_titles" name="total_world_titles" required>
                </div>

                <div class="form-group">
                    <label for="total_fastest_laps">Total Fastest Laps:</label>
                    <input type="number" id="total_fastest_laps" name="total_fastest_laps" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="submit-button">Add Driver</button>
                    <button type="reset" class="reset-button">Reset</button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
