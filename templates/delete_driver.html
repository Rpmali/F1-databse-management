<!DOCTYPE html>
<html>
<head>
    <title>Delete Driver</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
    <script type="module" src="{{ url_for('static', path='firebase-login.js') }}"></script>
</head>
<body>
    <div class="navbar">
        <h1>Delete Driver</h1>
        <div class="navbar-right">
            {% if user_token %}
            <p>USER: {{ user_token.email }}</p>
            <button id="logged-out">Logout</button>
            {% endif %}
        </div>
    </div>

    <div class="form-container">
        <a href="/get-drivers" class="back-button">← Back to Drivers List</a>
        <div class="form-box">
            <h2>Delete Driver</h2>
            
            {% if error_message %}
            <div class="alert alert-error">
                {{ error_message }}
            </div>
            {% endif %}
            
            {% if success_message %}
            <div class="alert alert-success">
                {{ success_message }}
            </div>
            {% endif %}

            <form class="add-form" method="POST" action="/delete-driver">
                <div class="form-group">
                    <label for="driver_name">Select Driver to Delete</label>
                    <select id="driver_name" name="driver_name" required>
                        <option value="">Select a driver</option>
                        {% for driver in drivers %}
                        <option value="{{ driver.to_dict().name }}">{{ driver.to_dict().name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="submit-button delete" onclick="return confirm('Are you sure you want to delete this driver?')">Delete Driver</button>
                    <button type="reset" class="reset-button">Reset</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
