<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Driver</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
</head>
<body>
    <div class="navbar">
        <h1>F1 Database</h1>
        <div class="navbar-right">
            <button id="logged-out">Sign Out</button>
        </div>
    </div>
    <div class="form-container">
        <a href="/dashboard" class="back-button">← Back to Dashboard</a>
        <div class="form-box">
            <h2>Update Driver</h2>
            
            {% if error_message %}
            <div class="alert alert-error">
                {{ error_message }}
            </div>
            {% endif %}
            
            {% if success_message %}
            <div class="alert alert-success">
                {{ success_message }}
            </div>
            {% endif %}

            <form class="add-form" method="POST" action="/update-driver">
                <div class="form-group">
                    <label for="driver_name">Select Driver to Update</label>
                    <select id="driver_name" name="driver_name" required>
                        <option value="">Select a driver</option>
                        {% for driver in drivers %}
                        <option value="{{ driver.to_dict().name }}">{{ driver.to_dict().name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="driver_age">Age</label>
                    <input type="number" id="driver_age" name="driver_age" required>
                </div>
                <div class="form-group">
                    <label for="total_pole_positions">Total Pole Positions</label>
                    <input type="number" id="total_pole_positions" name="total_pole_positions" required>
                </div>
                <div class="form-group">
                    <label for="total_race_wins">Total Race Wins</label>
                    <input type="number" id="total_race_wins" name="total_race_wins" required>
                </div>
                <div class="form-group">
                    <label for="total_points_scored">Total Points Scored</label>
                    <input type="number" id="total_points_scored" name="total_points_scored" required>
                </div>
                <div class="form-group">
                    <label for="total_world_titles">Total World Titles</label>
                    <input type="number" id="total_world_titles" name="total_world_titles" required>
                </div>
                <div class="form-group">
                    <label for="total_fastest_laps">Total Fastest Laps</label>
                    <input type="number" id="total_fastest_laps" name="total_fastest_laps" required>
                </div>
                <div class="form-group">
                    <label for="team">Team</label>
                    <select id="team" name="team" required>
                        <option value="">Select a team</option>
                        {% for team in teams %}
                        <option value="{{ team.to_dict()['name'] }}">{{ team.to_dict()['name'] }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="submit-button">Update Driver</button>
                    <button type="reset" class="reset-button">Reset</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
